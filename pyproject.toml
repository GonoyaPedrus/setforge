[project]
name = "setforge"
version = "0.1.0"
description = "Assistant DJ : analyse de bibliothèque, recommandation de transitions et construction de sets."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Analyse audio locale (étape 1). Licences permissives uniquement, voir THIRD_PARTY.md.
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
    "tinytag>=2.0",
]
index = [
    "lancedb>=0.13",
]
clap = [
    "torch>=2.4",
    "transformers>=4.45",
]

[project.scripts]
setforge = "setforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["setforge"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["librosa", "librosa.*", "pyarrow", "pyarrow.*", "lancedb", "lancedb.*", "torch", "torch.*", "transformers", "transformers.*"]
ignore_missing_imports = true
